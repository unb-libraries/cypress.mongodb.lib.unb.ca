dockworker:
  version: '6'
  application:
    name: MongoDB for E2E testing results at UNB Libraries
    uri: https://cypress.mongodb.lib.unb.ca
    description: >
      A MongoDB for E2E testing results at UNB Libraries.
    topics:
      - mongodb
      - testing
    identifiers:
      id: cypress.mongodb.lib.unb.ca
      slug: cypress-mongodb-lib-unb-ca
      short_slug: cypmong
      uuid: 3512
    framework:
      name: MongoDB
      version: 6
      startup_finished_marker: 'Waiting for connections'
      endpoint:
        name: http
        port: 27017
        readiness_timeout: 15
    license:
      license: MIT
      holder: University of New Brunswick Libraries
    shell:
      path: /bin/sh
  endpoints:
    env:
      - testing
    deployments:
      cypress-mongodb-lib-unb-ca:
        default: true
        managed: true
        name: cypress-mongodb-lib-unb-ca
  workflows:
    vcs:
      type: github
      owner: unb-libraries
      name: cypress.mongodb.lib.unb.ca
    jira:
      project_keys:
        - IN
    image:
      name: ghcr.io/unb-libraries/cypress.mongodb.lib.unb.ca
      parent: mongo:6.0
      repository: GitHub
      push-branches:
        - testing
